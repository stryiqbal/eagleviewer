<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Explore an eagle in your hands with this interactive 3D field guide."
    />
    <title>Myth Atlas — Featured creatures</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
      import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

      const DINOS = [
        {
          id: 'eagle',
          no: 'MA-001',
          era: [-1300, 0],
          eraLabel: 'Observed across recorded history',
          scale: '0.9 m',
          name: 'Eagle',
          latin: 'Aquila chrysaetos',
          family: 'Birds of prey',
          image: './Eagle.png?v=20261031152346',
          model: './Eagle.glb',
          yaw: 0,
          pitch: 0.1,
          tags: ['Raptor', 'Solitary', 'Keen-eyed'],
          lede: 'A powerful raptor with broad wings, a hooked beak and sharp eyesight.',
          traits: [
            ['t-wing', 'Wingspan', 'Up to 2.3 m'],
            ['t-time', 'Lifespan', 'Up to 30 years'],
            ['t-diet', 'Diet', 'Fish, mammals and birds'],
            ['t-range', 'Range', 'Northern Hemisphere'],
          ],
          habitat: 'Mountains, forests and open country.',
          caption: 'At home above the ridgelines.',
          closeup: 'Hooked beak, strong talons and broad flight feathers.',
          feature: ['A hunter built for the open sky.', 'Broad wings, sharp eyes and a sure grip.'],
        },
      ];

      const hero = document.getElementById('hero');
      const canvas = document.getElementById('gl');
      const stage = document.getElementById('stage');
      const tabsWrap = document.getElementById('tabs');
      const infoCard = document.getElementById('detail');
      const featImg = document.getElementById('featImg');
      const featTitle = document.getElementById('featTitle');
      const featText = document.getElementById('featText');
      const caption = document.getElementById('caption');
      const scaleEl = document.getElementById('scale');
      const loader = document.getElementById('loader');
      const loaderText = document.getElementById('loaderText');
      const stageHint = document.querySelector('.hint');
      const searchInput = document.querySelector('.search input');
      const tabButtons = [];

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const DUR = prefersReducedMotion ? 1 : 780;
      const clock = new THREE.Clock();
      const modelCache = new Map();
      const rigs = [];
      const visibility = { current: 0, previous: -1 };
      const state = {
        active: 0,
        zoom: 1,
        zoomGoal: 1,
        lastTouch: 0,
        touched: false,
        focus: false,
        day: true,
        dragVelocity: 0,
        dragX: 0,
        dragY: 0,
        pointerX: 0,
        pointerY: 0,
        yawQueue: 0,
        anim: null,
        light: { key: 1.6, rim: 0.5, env: 0.95, exposure: 1.05, keyColor: 0xfff4e2 },
        targetLight: { key: 1.6, rim: 0.5, env: 0.95, exposure: 1.05, keyColor: 0xfff4e2 },
        view: { cx: 0, cy: 0, px: 0, sw: 0 },
        goal: { cx: 0, cy: 0, px: 0, sw: 0 },
        homing: null,
      };

      function easeRate(dt) {
        return 1 - Math.exp(-dt * 7);
      }

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function clamp01(value) {
        return clamp(value, 0, 1);
      }

      function f(rate, dt) {
        return 1 - Math.exp(-dt * rate);
      }

      function setZoom(value) {
        state.zoomGoal = clamp(value, 0.55, 3.4);
        if (document.getElementById('zoomIn')) {
          document.getElementById('zoomIn').classList.toggle('on', state.zoomGoal >= 1);
        }
        if (document.getElementById('zoomOut')) {
          document.getElementById('zoomOut').classList.toggle('on', state.zoomGoal < 1);
        }
        const closeup = document.getElementById('closeup');
        if (closeup) {
          closeup.setAttribute('aria-pressed', String(state.zoomGoal > 2.2));
        }
      }

      function touched() {
        state.lastTouch = performance.now();
        state.touched = true;
        hero.classList.add('touched');
        if (state.homing) {
          state.homing = null;
        }
        clearTimeout(touched.hideTimer);
        touched.hideTimer = setTimeout(() => {
          hero.classList.remove('touched');
        }, 600);
      }

      function safeText(value) {
        return value || '';
      }

      function makeSvg(id) {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'ico');
        const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
        use.setAttributeNS('http://www.w3.org/1999/xlink', 'href', '#' + id);
        svg.appendChild(use);
        return svg;
      }

      function updateFeatureCard(item) {
        featImg.hidden = !item.image;
        if (item.image) featImg.src = item.image;
        featImg.alt = item.name;
        featTitle.textContent = item.name;
        featText.textContent = item.feature[0];
      }

      function toEraMarkup(eraStart, eraEnd) {
        const start = 100 - ((eraStart + 1300) / 2600) * 100;
        const end = 100 - ((eraEnd + 1300) / 2600) * 100;
        const from = clamp(start, 0, 100);
        const to = clamp(end, 0, 100);
        const labelFrom = clamp(from, 0, 100);
        const labelTo = clamp(to, 0, 100);
        const spanLeft = `${Math.max(0, labelFrom).toFixed(2)}%`;
        const spanW = `${Math.max(0.6, Math.abs(labelTo - labelFrom)).toFixed(2)}%`;
        return { from: spanLeft, width: spanW };
      }

      function renderEra(item) {
        const era = document.createElement('div');
        era.className = 'era';
        const bar = document.createElement('div');
        bar.className = 'bar';
        const segs = [
          document.createElement('b'),
          document.createElement('b'),
          document.createElement('b'),
        ];
        segs.forEach((seg) => bar.appendChild(seg));

        const u = document.createElement('u');
        const pos = toEraMarkup(item.era[0], item.era[1]);
        u.style.left = pos.from;
        u.style.width = pos.width;
        u.setAttribute('data-l', item.eraLabel);
        u.classList.toggle('l', parseFloat(pos.from) < 50);
        bar.appendChild(u);

        const lab = document.createElement('div');
        lab.className = 'lab';
        ['Antiquity', 'Medieval', 'Modern'].forEach((label) => {
          const span = document.createElement('span');
          span.textContent = label;
          lab.appendChild(span);
        });

        era.appendChild(bar);
        era.appendChild(lab);
        return era;
      }

      function renderTraits(item) {
        const dl = document.createElement('dl');
        dl.className = 'traits';
        item.traits.forEach(([iconId, label, value]) => {
          const row = document.createElement('div');
          row.className = 'trait';
          const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          icon.classList.add('ico');
          const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
          use.setAttribute('href', '#' + iconId);
          icon.appendChild(use);
          const dt = document.createElement('dt');
          dt.textContent = label;
          const dd = document.createElement('dd');
          dd.textContent = value;
          row.append(icon, dt, dd);
          dl.appendChild(row);
        });
        return dl;
      }

      function renderDetail(item, boot = false) {
        infoCard.innerHTML = '';
        infoCard.classList.remove('leaving');

        const pieces = [];
        const eyebrow = document.createElement('div');
        eyebrow.className = 'eyebrow';
        eyebrow.textContent = `${item.family} — Specimen ${item.no}`;
        eyebrow.style.setProperty('--i', 0);
        pieces.push(eyebrow);

        const h1 = document.createElement('h1');
        h1.style.setProperty('--i', 1);
        h1.innerHTML = `${safeText(item.name)}<em>${safeText(item.latin)}</em>`;
        pieces.push(h1);

        const tags = document.createElement('div');
        tags.className = 'tags';
        tags.style.setProperty('--i', 2);
        item.tags.forEach((tag) => {
          const span = document.createElement('span');
          span.textContent = tag;
          tags.appendChild(span);
        });
        pieces.push(tags);

        const lede = document.createElement('p');
        lede.className = 'lede';
        lede.style.setProperty('--i', 3);
        lede.textContent = item.lede;
        pieces.push(lede);

        const era = renderEra(item);
        era.style.setProperty('--i', 4);
        pieces.push(era);

        const notes = document.createElement('h2');
        notes.textContent = 'Field notes';
        notes.style.setProperty('--i', 5);
        pieces.push(notes);

        const traits = renderTraits(item);
        traits.style.setProperty('--i', 6);
        pieces.push(traits);

        const haunts = document.createElement('h2');
        haunts.textContent = 'Haunts';
        haunts.style.setProperty('--i', 7);
        pieces.push(haunts);

        const habitat = document.createElement('div');
        habitat.className = 'habitat';
        habitat.style.setProperty('--i', 8);
        const habitatIcon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        habitatIcon.classList.add('ico');
        const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
        use.setAttribute('href', '#t-reed');
        habitatIcon.appendChild(use);
        const habitatText = document.createElement('span');
        habitatText.textContent = item.habitat;
        habitat.append(habitatIcon, habitatText);
        pieces.push(habitat);

        const closeupWrap = document.createElement('div');
        closeupWrap.className = 'closeup-wrap';
        closeupWrap.style.setProperty('--i', 9);
        const btn = document.createElement('button');
        btn.id = 'closeup';
        btn.className = 'closeup';
        btn.classList.toggle('no-image', !item.image);
        btn.type = 'button';
        btn.setAttribute('aria-pressed', 'false');
        btn.innerHTML = `
          ${item.image ? `<span class="lens" style="background-image:url('${item.image}'); background-position:${item.lens}; background-size:520%;"></span>` : ''}
          <span class="copy"><b>Close-up Detail</b><small>${item.closeup}</small></span>
          <svg class="ico" aria-hidden="true"><use href="#i-chev"></use></svg>
        `;
        btn.addEventListener('click', () => {
          const newZoom = state.zoomGoal > 2.2 ? 1 : 2.6;
          setZoom(newZoom);
          touched();
        });
        closeupWrap.appendChild(btn);
        pieces.push(closeupWrap);

        pieces.forEach((node) => infoCard.appendChild(node));
        const closeup = document.getElementById('closeup');
        if (closeup) {
          closeup.setAttribute('aria-pressed', String(state.zoomGoal > 2.2));
        }
        if (boot) {
          const all = [...infoCard.children];
          all.forEach((el, index) => {
            el.style.animationDelay = `${index * 45}ms`;
          });
        }
      }

      function paintInfo(i, boot = false) {
        const item = DINOS[i];
        renderDetail(item, boot);
        caption.textContent = item.caption;
        scaleEl.textContent = item.scale;
        updateFeatureCard(item);
        featTitle.textContent = item.name;
        featText.textContent = item.feature[1] || item.feature[0];
        const cardAn = document.querySelector('.card');
        if (cardAn) {
          cardAn.scrollTop = 0;
        }
      }

      function setCamera() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const view = state.view;
        const camera = window.__atlasCam;
        const renderer = window.__atlasRenderer;
        if (!camera || !renderer) return;

        const W = Math.max(1, width);
        const H = Math.max(1, height);
        camera.aspect = W / H;
        camera.position.z = H / (2 * Math.tan(THREE.MathUtils.degToRad(26 / 2)) * view.px * state.zoom);
        camera.setViewOffset(W, H, W / 2 - view.cx, H / 2 - view.cy, W, H);
        renderer.setSize(W, H, false);
      }

      function measure() {
        const hRect = hero.getBoundingClientRect();
        const sRect = stage.getBoundingClientRect();
        const focus = hero.classList.contains('focus');
        const base = focus ? hero : stage;
        const rect = base.getBoundingClientRect();
        const frameScale = window.innerHeight < 500 ? 0.96 : 1.16;

        const target = {
          cx: rect.left - hRect.left + rect.width / 2,
          cy: rect.top - hRect.top + rect.height * 0.5,
          px: Math.min(rect.width * 0.5, rect.height * 0.6) * frameScale,
          sw: rect.width,
        };

        state.goal = target;
        state.view.cx += (target.cx - state.view.cx) * 0.85;
        state.view.cy += (target.cy - state.view.cy) * 0.85;
        state.view.px += (target.px - state.view.px) * 0.85;
        state.view.sw += (target.sw - state.view.sw) * 0.85;
        setCamera();
      }

      function createRig(entry, index) {
        const pivot = new THREE.Group();
        pivot.visible = false;
        const spin = new THREE.Group();
        const holder = new THREE.Group();
        pivot.name = `pivot-${entry.id}`;
        spin.name = `spin-${entry.id}`;
        holder.name = `holder-${entry.id}`;
        pivot.add(spin);
        spin.add(holder);

        const homeQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(entry.pitch, entry.yaw, 0, 'YXZ'));
        spin.quaternion.copy(homeQuat);

        const rig = { entry, pivot, spin, holder, model: null, failed: false, visible: false, animation: null };
        rigs[index] = rig;
        return rig;
      }

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NeutralToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.setClearColor(0x000000, 0);
      window.__atlasRenderer = renderer;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 100);
      window.__atlasCam = camera;
      camera.position.set(0, 0, 3.5);

      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.95;

      const key = new THREE.DirectionalLight(0xfff4e2, 1.6);
      key.position.set(2.5, 4, 5);
      scene.add(key);

      const rim = new THREE.DirectionalLight(0xbfd8ff, 0.5);
      rim.position.set(-4, 2, -3);
      scene.add(rim);

      const ambient = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambient);

      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
      dracoLoader.preload();

      const loader3d = new GLTFLoader();
      loader3d.setDRACOLoader(dracoLoader);
      loader3d.setMeshoptDecoder(MeshoptDecoder);

      const rootGroup = new THREE.Group();
      rootGroup.position.z = 0;
      scene.add(rootGroup);

      DINOS.forEach((entry, index) => {
        const rig = createRig(entry, index);
        rootGroup.add(rig.pivot);
      });

      const activeEntry = DINOS[0];

      function updateLights() {
        const target = state.targetLight;
        const current = state.light;
        current.key = THREE.MathUtils.lerp(current.key, target.key, 0.08);
        current.rim = THREE.MathUtils.lerp(current.rim, target.rim, 0.08);
        current.env = THREE.MathUtils.lerp(current.env, target.env, 0.08);
        current.exposure = THREE.MathUtils.lerp(current.exposure, target.exposure, 0.08);
        const nextColor = new THREE.Color(target.keyColor);
        const currColor = new THREE.Color(current.keyColor);
        current.keyColor = new THREE.Color().lerpColors(currColor, nextColor, 0.08).getHex();
        key.color.setHex(current.keyColor);
        key.intensity = current.key;
        rim.intensity = current.rim;
        scene.environmentIntensity = current.env;
        renderer.toneMappingExposure = current.exposure;
      }

      async function loadOne(index) {
        const entry = DINOS[index];
        if (modelCache.has(entry.id)) return modelCache.get(entry.id);

        const rig = rigs[index];
        const p = new Promise((resolve, reject) => {
          rig.failed = false;
          stage.classList.remove('load-error');
          loaderText.textContent = 'Preparing the specimen…';
          loader3d.load(
            entry.model,
            (gltf) => {
              const model = gltf.scene;
              model.traverse((obj) => {
                if (obj.isMesh) {
                  obj.frustumCulled = false;
                  if (obj.material && obj.material.map) {
                    obj.material.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
                  }
                  obj.material && (obj.material.envMapIntensity = 1);
                }
              });

              const box = new THREE.Box3().setFromObject(model);
              const center = box.getCenter(new THREE.Vector3());
              const size = box.getSize(new THREE.Vector3());
              const radius = size.length() || 1;
              model.position.sub(center);
              model.scale.setScalar(2.3 / radius);
              rig.model = model;
              rig.holder.add(model);
              modelCache.set(entry.id, Promise.resolve(model));
              resolve(model);
            },
            (event) => {
              if (state.active !== index || !event.total) return;
              const percent = Math.round((event.loaded / event.total) * 100);
              loaderText.textContent = `Loading 3D specimen… ${percent}%`;
            },
            (error) => {
              console.error('Model load failed', entry.id, error);
              rig.failed = true;
              if (state.active === index) {
                stage.classList.add('load-error');
                loaderText.textContent = '3D specimen unavailable. Select this tab to retry.';
              }
              modelCache.delete(entry.id);
              reject(error);
            }
          );
        });

        modelCache.set(entry.id, p);
        return p;
      }

      function showLoader(value) {
        const visible = value || stage.classList.contains('load-error');
        loader.classList.toggle('show', visible);
        if (visible) {
          hero.classList.add('loading');
        } else {
          hero.classList.remove('loading');
        }
      }

      function animateInfoSwap(fromIndex, toIndex) {
        const detail = document.querySelector('.detail');
        if (!detail) return;
        detail.classList.add('leaving');
        setTimeout(() => {
          paintInfo(toIndex, false);
          detail.classList.remove('leaving');
        }, 200);
      }

      function setLight(mode) {
        state.day = mode === 'day';
        hero.dataset.light = state.day ? 'day' : 'dusk';
        document.body.style.background = state.day ? '' : '#14170f';
        const label = document.getElementById('light');
        if (label) {
          label.classList.toggle('on', !state.day);
          label.setAttribute('aria-pressed', String(!state.day));
          label.setAttribute('aria-label', state.day ? 'Switch to dusk lighting' : 'Switch to daylight');
        }
        state.targetLight.key = state.day ? 1.6 : 2.6;
        state.targetLight.rim = state.day ? 0.5 : 1.9;
        state.targetLight.env = state.day ? 0.95 : 0.28;
        state.targetLight.exposure = state.day ? 1.05 : 1.0;
        state.targetLight.keyColor = state.day ? 0xfff4e2 : 0xffc98a;
      }

      function tick() {
        const dt = Math.min(clock.getDelta(), 0.05);
        const now = performance.now();

        const zoomEase = state.zoomGoal - state.zoom;
        state.zoom += zoomEase * (prefersReducedMotion ? 1 : 0.12);
        const zoomIn = document.getElementById('zoomIn');
        const zoomOut = document.getElementById('zoomOut');
        if (zoomIn) zoomIn.classList.toggle('on', state.zoomGoal >= 1);
        if (zoomOut) zoomOut.classList.toggle('on', state.zoomGoal < 1);

        if (state.homing) {
          const spin = state.homing.rig.spin;
          const home = state.homing.rig.entry;
          const target = new THREE.Quaternion().setFromEuler(new THREE.Euler(home.pitch, home.yaw, 0, 'YXZ'));
          spin.quaternion.slerp(target, f(6, dt));
          if (spin.quaternion.angleTo(target) < 0.002) {
            spin.quaternion.copy(target);
            state.homing = null;
          }
        }

        if (Math.abs(state.yawQueue) > 0.0001) {
          const angle = state.yawQueue * f(5, dt);
          state.yawQueue -= angle;
          const activeRig = rigs[state.active];
          if (activeRig) {
            const yaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), angle);
            activeRig.spin.quaternion.premultiply(yaw);
          }
        }

        if (Math.abs(state.dragVelocity) > 0.0001) {
          const drag = state.dragVelocity * Math.exp(-dt * 4.5);
          state.dragVelocity = drag;
          const activeRig = rigs[state.active];
          if (activeRig) {
            const yaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), drag);
            activeRig.spin.quaternion.premultiply(yaw);
          }
        }

        const activeRig = rigs[state.active];
        if (activeRig) {
          activeRig.pivot.visible = true;
          activeRig.pivot.position.set(0, 0, 0);
        }

        const current = state.active;
        const from = state.anim && state.anim.from;
        const to = state.anim && state.anim.to;

        if (state.anim) {
          const t = clamp((now - state.anim.t0) / DUR, 0, 1);
          const dir = state.anim.dir || 1;
          const e = Math.pow(t, 3);
          const out = t < 0.6 ? (1 - Math.pow(1 - t / 0.6, 3)) : 1;

          if (from >= 0 && from !== to) {
            const oldRig = rigs[from];
            if (oldRig) {
              const k = 1 - out;
              oldRig.pivot.position.x = -dir * out * (state.view.sw * 0.95 / state.view.px || 1);
              oldRig.pivot.rotation.z = -dir * out * 1.4;
              oldRig.pivot.scale.setScalar(k);
            }
          }

          if (to >= 0) {
            const newRig = rigs[to];
            if (newRig) {
              const e2 = 1 - Math.pow(1 - t, 3);
              const k = Math.max(0.0001, 1 + 2.2 * (Math.pow(t - 1, 3)) + 1.2 * Math.pow(t - 1, 4)) * (0.25 + 0.75 * e2);
              newRig.pivot.position.x = dir * (1 - e2) * (state.view.sw * 0.95 / state.view.px || 1);
              newRig.pivot.rotation.z = dir * (1 - e2) * 1.6;
              newRig.pivot.scale.setScalar(k);
            }
          }
        }

        const nowSec = performance.now() * 0.001;
        rigs.forEach((rig, index) => {
          if (!rig || !rig.pivot) return;
          const idle = clamp01((now - state.lastTouch - 1800) / 1500);
          const hover = Math.sin(nowSec * 1.3 + index) * 0.028;
          rig.pivot.position.y = hover - 0.2;
          rig.pivot.rotation.x = Math.sin(nowSec * 0.9 + index) * 0.03 * idle;
          rig.pivot.rotation.y = Math.sin(nowSec * 0.55 + index) * 0.16 * idle;
          rig.pivot.position.z = 0;
        });

        if (state.anim && now - state.anim.t0 > DUR) {

      function setActive(index) {
        if (index === state.active) return;
        const dir = Math.sign(index - state.active);
        const previous = state.active;
        state.active = index;
        const oldRig = rigs[previous];
        if (oldRig) {
          oldRig.pivot.visible = true;
        }
        const currentRig = rigs[index];
        if (currentRig) {
          currentRig.pivot.visible = true;
        }
        state.anim = { from: previous, to: index, dir, t0: performance.now() };
        paintInfo(index, false);
        stage.classList.add('switching');
        setTimeout(() => {
          stage.classList.remove('switching');

        state.zoomGoal = 1;
        setZoom(1);

      function buildTabs() {
        DINOS.forEach((item, index) => {
          const tab = document.createElement('button');
          const no = String(index + 1).padStart(2, '0');
          tab.type = 'button';
          tab.className = 'tab';
          tab.setAttribute('role', 'tab');
          tab.id = `tab-${item.id}`;
          tab.dataset.index = index;
          tab.dataset.no = no;
          tab.setAttribute('aria-selected', index === 0 ? 'true' : 'false');
          tab.setAttribute('tabindex', index === 0 ? '0' : '-1');
          if (item.image) {
            const image = document.createElement('img');
            image.src = item.image;
            image.alt = item.name;
            tab.appendChild(image);
          }
          tab.insertAdjacentHTML('beforeend', `
            <b>${item.name}</b>
            <i>${item.latin}</i>

          tab.addEventListener('click', () => { selectByIndex(index); });
          tabButtons.push(tab);
          tabsWrap.appendChild(tab);

          btn.tabIndex = selected ? 0 : -1;

      async function selectByIndex(index, fromBoot = false) {
        if (index === state.active && !fromBoot && !rigs[index].failed) return;
        const previous = state.active;
        state.active = index;
        stage.classList.add('switching');
        const target = DINOS[index];
        const previousInfo = document.querySelector('.detail');
        previousInfo && previousInfo.classList.add('leaving');

        if (!rigs[index].model) {
          showLoader(true);
          try {
            await loadOne(index);
          } catch (error) {
            console.error('Failed to load active model', error);
          }
          if (state.active !== index) {
            return;
          }
          if (!rigs[index].model) {
            stage.classList.remove('switching');
            setTabState(index);
            paintInfo(index, false);

            stage.classList.add('load-error');

        if (oldRig) {

        }
        setTabState(index);
        stage.classList.remove('switching');
        showLoader(false);
        setZoom(1);
        state.dragVelocity = 0;
        state.yawQueue = 0;
      }

      function bindEvents() {
        window.addEventListener('resize', () => {

          setCamera();

          } else if (event.key === '+' || event.key === '=') {
            setZoom(state.zoomGoal * 1.2);
          } else if (event.key === '-') {
            setZoom(state.zoomGoal / 1.2);
          }
          touched();
        });

        document.getElementById('zoomIn').addEventListener('click', () => {
          setZoom(state.zoomGoal * 1.35);
          touched();
        });
        document.getElementById('zoomOut').addEventListener('click', () => {
          setZoom(state.zoomGoal / 1.35);
          touched();
        });
        document.getElementById('expand').addEventListener('click', () => {
          hero.classList.toggle('focus');
          const on = hero.classList.contains('focus');
          document.getElementById('expand').classList.toggle('on', on);
          document.getElementById('expand').setAttribute('aria-pressed', String(on));
          document.getElementById('expand').setAttribute('aria-label', on ? 'Close expanded viewer' : 'Expand viewer');
          measure();
          touched();
        });

          setLight(hero.dataset.light === 'day' ? 'dusk' : 'day');
          touched();
        });

        document.getElementById('turnL').addEventListener('click', () => {
          state.yawQueue -= Math.PI / 2;
          touched();
        });
        document.getElementById('turnFull').addEventListener('click', () => {
          state.yawQueue += Math.PI * 2;
          touched();
        });
        document.getElementById('turnR').addEventListener('click', () => {
          state.yawQueue += Math.PI / 2;
          touched();
        });

        document.querySelectorAll('.nav button').forEach((button) => {
          button.addEventListener('click', () => {
            document.querySelectorAll('.nav button').forEach((b) => b.setAttribute('aria-current', b === button ? 'page' : 'false'));
          });
        });
      }

      function boot() {
        buildTabs();
        setTabState(0);
        paintInfo(0, true);
        setLight('day');
        measure();
        showLoader(true);
        loadOne(0)
          .then(() => {
            showLoader(false);
            const firstRig = rigs[0];
            if (firstRig) {
              firstRig.pivot.visible = true;
              firstRig.pivot.scale.setScalar(0.0001);
            }
            state.anim = { from: -1, to: 0, dir: 1, t0: performance.now() };
            showLoader(false);
            loadOne(1).catch(() => {});
          })
          .catch(() => {
            showLoader(false);
          });
        bindEvents();
        setInterval(() => {
          if (state.active !== 0 && !modelCache.has(DINOS[state.active].id)) {
            loadOne(state.active).catch(() => {});
          }
        }, 2000);
        requestAnimationFrame(loop);
      }

      function loop() {
        tick();
        requestAnimationFrame(loop);
      }

      boot();

        background:var(--ink);
        color:var(--panel);
        display:grid;
        place-items:center;
      }
      .card {
        background:var(--panel);
        border:1px solid var(--line);
        border-radius:3px;
        box-shadow: inset 0 0 0 4px var(--panel), inset 0 0 0 5px var(--line);
        padding:26px 24px 20px;
        overflow-y:auto;
        overscroll-behavior:contain;
        scrollbar-width:thin;
      }
      .detail {
        display:flex;
        flex-direction:column;
        min-height:100%;
      }
      .detail > * { animation:rise .6s var(--ease) both; animation-delay:calc(var(--i,0)*45ms); }
      .detail.leaving > * { animation:sink .2s ease-in both; animation-delay:0s; }
      @keyframes rise { from { opacity:0; transform:translateY(12px); } }
      @keyframes sink { to { opacity:0; transform:translateY(-6px); } }
      .detail .eyebrow { color:var(--muted); }
      .detail h1 {
        margin-top:8px;
        font-family:var(--serif);
        font-size:clamp(42px,4.4vw,58px);
        line-height:.96;
        letter-spacing:-0.035em;
        font-weight:300;
        font-variation-settings:"opsz" 144;
      }
      .detail h1 em {
        display:block;
        margin-top:8px;
        font-size:.36em;
        letter-spacing:0;
        color:var(--muted);
        font-style:italic;
      }
      .tags {
        display:flex;
        flex-wrap:wrap;
        gap:8px;
        margin-top:16px;
      }
      .tags span {
        padding:5px 9px;
        border:1px solid var(--line);
        border-radius:2px;
        font-family:var(--mono);
        font-size:10.5px;
        letter-spacing:.04em;
      }
      .lede {
        margin-top:16px;
        font-size:13.5px;
        line-height:1.55;
        text-wrap:pretty;
      }
      .era {
        margin-top:14px;
      }
      .bar {
        position:relative;
        display:grid;
        grid-template-columns:1300fr 1000fr 400fr;
        height:6px;
        border-radius:2px;
        overflow:hidden;
      }
      .bar b {
        display:block;
        background:var(--chip);
        border-left:1px solid var(--panel);
      }
      .bar b:first-child { border-left:0; }
      .bar u {
        position:absolute;
        top:-3px;
        height:12px;
        min-width:3px;
        background:var(--accent);
        border-radius:1px;
        left:0;
      }
      .bar u::after {
        content:attr(data-l);
        position:absolute;
        right:0;
        top:15px;
        color:var(--accent);
        font-family:var(--mono);
        font-size:9.5px;
        letter-spacing:.04em;
        white-space:nowrap;
      }
      .bar u.l::after {
        right:auto;
        left:0;
      }
      .lab {
        display:grid;
        grid-template-columns:1300fr 1000fr 400fr;
        gap:0;
        margin-top:20px;
        font-family:var(--mono);
        font-size:9px;
        letter-spacing:.12em;
        text-transform:uppercase;
        color:var(--muted);
      }
      .detail h2 {
        margin-top:18px;
        padding-top:14px;
        border-top:1px solid var(--line);
        color:var(--muted);
        font-family:var(--mono);
        font-size:10px;
        letter-spacing:.2em;
        text-transform:uppercase;
        font-weight:500;
      }
      .traits {
        margin-top:10px;
        display:grid;
        gap:9px;
      }
      .trait {
        display:flex;
        align-items:center;
        gap:10px;
      }
      .trait svg {
        width:18px;
        height:18px;
        color:var(--muted);
      }
      .trait dt {
        display:flex;
        align-items:center;
        flex:1;
        min-width:0;
        color:var(--muted);
        font-size:13px;
      }
      .trait dt::after {
        content:"";
        display:block;
        flex:1;
        margin:0 8px;
        border-bottom:1px dotted var(--line);
        transform:translateY(-3px);
      }
      .trait dd {
        color:var(--ink);
        font-size:13px;
        font-weight:500;
      }
      .habitat {
        display:flex;
        align-items:center;
        gap:16px;
        margin-top:12px;
        font-size:13px;
      }
      .closeup-wrap {
        margin-top:auto;
        padding-top:16px;
      }
      .closeup {
        width:100%;
        display:grid;
        grid-template-columns:76px 1fr 18px;
        align-items:center;
        gap:14px;
        padding:10px;
        border:1px solid var(--line);
        border-radius:3px;
        background:transparent;
        transition:border-color .2s ease, background-color .2s ease;
      }
      .closeup.no-image { grid-template-columns:1fr 18px; }
      .closeup:hover, .closeup[aria-pressed="true"] {
        border-color:var(--accent);
        background:var(--accent-tint);
      }
      .lens {
        width:76px;
        height:76px;
        border-radius:2px;
        background-size:520%;
        background-position:50% 25%;
        background-repeat:no-repeat;
        background-color:var(--chip);
      }
      .closeup .copy {
        display:flex;
        flex-direction:column;
        gap:4px;
        min-width:0;
      }
      .closeup b {
        font-family:var(--serif);
        font-size:18px;
        font-weight:400;
      }
      .closeup small {
        color:var(--muted);
        font-size:11.5px;
        line-height:1.4;
      }
      .closeup .ico {
        width:18px;
        height:18px;
        transition:transform .3s ease;
      }
      .closeup[aria-pressed="true"] .ico { transform:rotate(180deg); }
      .hero.focus .side,
      .hero.focus .info,
      .hero.focus .tabs {
        opacity:0;
        pointer-events:none;
        transition:opacity .5s var(--ease), transform .5s var(--ease);
      }
      .hero.focus .side { transform:translateX(-24px); }
      .hero.focus .info { transform:translateX(24px); }
      .hero.focus .tabs { transform:translateY(-16px); }
      .hero.focus .stage {
        position:absolute;
        inset:0;
      }
      .hero.focus .caption {
        max-width:75%;
        left:50%;
        transform:translateX(-50%);
      }
      @media (max-width:1100px) {
        .hero { grid-template-columns:minmax(0,1fr) clamp(280px,36vw,340px); }
        .side { display:none; }
        .main { padding-left:20px; }
      }
      @media (max-width:760px) {
        .hero {
          display:flex;
          flex-direction:column;
        }
        .info { display:contents; }
        .top {
          order:1;
          padding:10px 14px 0;
          position:relative;
        }
        .top::before {
          content:"Myth Atlas";
          font-family:var(--serif);
          font-size:21px;
          margin-right:auto;
        }
        .search {
          width:32px;
          height:32px;
          padding:0;
          justify-content:center;
          border-radius:50%;
        }
        .search input { display:none; }
        .main {
          order:2;
          flex:1;
          min-height:0;
          padding:10px 14px 6px;
        }
        .stage { min-height:0; }
        .tabs { gap:8px; }
        .tab {
          flex:1;
          display:grid;
          grid-template-columns:44px 1fr;
          justify-items:start;
          width:auto;
          min-width:0;
          padding:6px 10px;
        }
        .tab img {
          width:44px;
          height:40px;
          grid-row:1 / span 2;
          margin-top:0;
        }
        .tab b { font-size:15px; }
        .tab i { font-size:12px; }
        .rail button { width:34px; height:34px; }
        .turn { bottom:30px; }
        .caption { font-size:15px; }
        .hint { display:none; }
        .ground { bottom:17%; height:30px; }
        .card {
          order:3;
          position:relative;
          z-index:7;
          flex:0 0 auto;
          max-height:40dvh;
          border-radius:10px 10px 0 0;
          border-top:1px solid var(--line);
          border-left:1px solid var(--line);
          border-right:1px solid var(--line);
          border-bottom:none;
          box-shadow:none;
          padding:14px 16px calc(14px + env(safe-area-inset-bottom));
          transition:transform .5s var(--ease), background-color .6s;
        }
        .detail h1 { font-size:34px; margin-top:4px; }
        .tags { margin-top:10px; }
        .lede { margin-top:10px; font-size:13px; }
        .detail h2 { margin-top:12px; padding-top:10px; }
        .top .iconbtn, .top .account { display:none; }
        .hero.focus .card {
          position:absolute;
          left:0;
          right:0;
          bottom:0;
          transform:translateY(105%);
        }
      }
      @media (max-height:720px) and (min-width:761px) {
        .main { padding-top:16px; }
        .side { padding-top:14px; }
        .nav { margin-top:14px; }
        .feature { padding:8px 8px 8px; }
        #featImg { height:64px; }
        .info { gap:8px; padding-top:6px; padding-bottom:8px; }
        .card { padding:12px 14px 10px; }
        .detail h1 { margin-top:5px; font-size:clamp(38px,3.2vw,42px); }
        .detail h1 em { margin-top:5px; }
        .tags { gap:6px; margin-top:10px; }
        .tags span { padding:4px 7px; }
        .lede { margin-top:10px; font-size:12px; line-height:1.42; }
        .era { margin-top:9px; }
        .lab { margin-top:16px; }
        .detail h2 { margin-top:10px; padding-top:8px; }
        .traits { margin-top:6px; gap:5px; }
        .trait dt, .trait dd, .habitat { font-size:12px; }
        .habitat { gap:10px; margin-top:6px; }
        .closeup-wrap { padding-top:8px; }
        .closeup { grid-template-columns:58px 1fr 18px; gap:10px; padding:7px; }
        .lens { width:58px; height:58px; }
        .closeup b { font-size:16px; }
        .closeup small { font-size:10px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration:.01ms !important;
          animation-iteration-count:1 !important;
          transition-duration:.01ms !important;
          scroll-behavior:auto !important;
        }
      }

          <button class="iconbtn" type="button" aria-label="Notifications"><svg class="ico"><use href="#i-bell"></use></svg></button>
          <div class="account" aria-label="Account">
            <span class="avatar"><svg class="ico"><use href="#i-user"></use></svg></span>
          </div>
        </div>

        <div class="card">
          <article class="detail" id="detail" aria-live="polite"></article>
        </div>
      </section>
    </main>
  </body>
